<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">InternetToggle — Control Your Connection, Instantly</title>
  <desc id="desc">Dark blue promotional cover for InternetToggle, a Windows system-tray utility for toggling a selected network adapter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.58" stop-color="#0a1c35"/>
      <stop offset="1" stop-color="#06101e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58d5ff"/>
      <stop offset="1" stop-color="#2874ff"/>
    </linearGradient>
    <linearGradient id="toggle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c98b"/>
      <stop offset="1" stop-color="#73edbd"/>
    </linearGradient>
    <radialGradient id="glow" cx="84%" cy="24%" r="80%">
      <stop offset="0" stop-color="#1558b5" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1558b5" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000814" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="675" rx="28" fill="url(#glow)"/>
  <circle cx="1060" cy="90" r="190" fill="#1d74e8" opacity=".07"/>
  <circle cx="1080" cy="100" r="134" fill="none" stroke="#5db8ff" stroke-opacity=".13"/>
  <circle cx="1080" cy="100" r="165" fill="none" stroke="#5db8ff" stroke-opacity=".08"/>
  <path d="M0 522 C255 478 407 571 650 532 S1011 480 1200 520" fill="none" stroke="#397fc7" stroke-opacity=".16" stroke-width="2"/>

  <g transform="translate(68 74)">
    <rect width="106" height="106" rx="26" fill="url(#accent)"/>
    <circle cx="49" cy="49" r="29" fill="none" stroke="#fff" stroke-width="3.4"/>
    <ellipse cx="49" cy="49" rx="14" ry="29" fill="none" stroke="#fff" stroke-width="2.6"/>
    <path d="M20 49h58 M25 33h48 M25 65h48 M49 20v58" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="48" y="61" width="48" height="25" rx="12.5" fill="url(#toggle)" stroke="#e9fff6" stroke-width="2"/>
    <circle cx="82" cy="73.5" r="9" fill="#fff"/>
  </g>
  <text x="200" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="47" font-weight="750" fill="#f5f9ff">Internet<tspan fill="#4dbdff">Toggle</tspan></text>
  <text x="202" y="157" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#a8c6ea">A tiny tray utility. One shortcut. Your chosen adapter.</text>
  <text x="70" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#c7d8ef">Enable or disable a Windows network adapter without opening Settings.</text>
  <text x="70" y="259" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#c7d8ef">Made for focused work, editing sessions, and quick offline moments.</text>

  <g transform="translate(680 58)" filter="url(#shadow)">
    <rect width="448" height="398" rx="22" fill="#0c1829" stroke="#4777a8" stroke-opacity=".75" stroke-width="1.5"/>
    <rect x="1" y="1" width="446" height="54" rx="21" fill="#13243a"/>
    <circle cx="29" cy="28" r="6" fill="#42e4a8"/>
    <text x="48" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" fill="#eef7ff">InternetToggle</text>
    <text x="415" y="35" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8caed5">TRAY MENU</text>

    <text x="26" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="1.5" fill="#7e9cbc">NETWORK STATUS</text>
    <rect x="20" y="106" width="408" height="58" rx="12" fill="#122a43" stroke="#2c5278"/>
    <circle cx="46" cy="135" r="8" fill="#4bd8a0"/>
    <text x="66" y="141" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" fill="#f0f7ff">Ethernet</text>
    <text x="407" y="141" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7fe2b9">Enabled</text>

    <g transform="translate(23 183)">
      <rect width="402" height="50" rx="10" fill="#153c6a" stroke="#3376b8"/>
      <path d="M20 25h20 M30 15v20" stroke="#a9d7ff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="54" y="31" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#f6fbff">Disable Ethernet</text>
      <text x="382" y="31" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#a5c8ee">Ctrl + Alt + T</text>
    </g>
    <g transform="translate(23 244)">
      <rect width="402" height="45" rx="10" fill="#101f32" stroke="#233d58"/>
      <path d="M18 22c8-10 20-10 28 0 M23 27c5-6 13-6 18 0 M29 32c2-2 4-2 6 0" fill="none" stroke="#8bb8e4" stroke-width="2.2" stroke-linecap="round"/>
      <text x="54" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#d5e5f7">Select network adapter</text>
      <path d="m386 18 6 5-6 5" fill="none" stroke="#8bb8e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(23 300)">
      <rect width="402" height="42" rx="10" fill="#101f32" stroke="#233d58"/>
      <circle cx="30" cy="21" r="9" fill="none" stroke="#8bb8e4" stroke-width="2"/>
      <path d="M30 16v6l4 3" fill="none" stroke="#8bb8e4" stroke-width="2" stroke-linecap="round"/>
      <text x="54" y="27" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#d5e5f7">Run at Windows sign-in</text>
      <rect x="354" y="12" width="28" height="18" rx="9" fill="#203c55"/>
      <circle cx="363" cy="21" r="6" fill="#8bb8e4"/>
    </g>
    <text x="26" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7e9cbc">Simple by design · No third-party packages</text>
  </g>

  <g transform="translate(70 322)">
    <g>
      <rect width="165" height="99" rx="16" fill="#0e2035" stroke="#244d73"/>
      <path d="M23 29h30 M38 18v23 M24 51h28" stroke="#4dbdff" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="38" cy="18" r="5" fill="#4dbdff"/><circle cx="24" cy="51" r="5" fill="#4dbdff"/><circle cx="52" cy="51" r="5" fill="#4dbdff"/>
      <text x="20" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#e8f3ff">Adapter choice</text>
      <text x="20" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#91afd0">Ethernet · Wi-Fi · more</text>
    </g>
    <g transform="translate(183 0)">
      <rect width="165" height="99" rx="16" fill="#0e2035" stroke="#244d73"/>
      <rect x="22" y="19" width="44" height="29" rx="6" fill="none" stroke="#b68cff" stroke-width="2.5"/>
      <path d="M29 28h5 M40 28h5 M51 28h5 M29 38h5 M40 38h5 M51 38h5" stroke="#b68cff" stroke-width="3" stroke-linecap="round"/>
      <text x="20" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#e8f3ff">Global hotkey</text>
      <text x="20" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#91afd0">Ctrl + Alt + T</text>
    </g>
    <g transform="translate(366 0)">
      <rect width="165" height="99" rx="16" fill="#0e2035" stroke="#244d73"/>
      <path d="M44 15l19 7v14c0 12-9 19-19 23-10-4-19-11-19-23V22z" fill="none" stroke="#ffbf66" stroke-width="2.6" stroke-linejoin="round"/>
      <text x="20" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#e8f3ff">Admin support</text>
      <text x="20" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#91afd0">Clear permission flow</text>
    </g>
    <g transform="translate(549 0)">
      <rect width="165" height="99" rx="16" fill="#0e2035" stroke="#244d73"/>
      <circle cx="45" cy="33" r="20" fill="none" stroke="#49dfa7" stroke-width="2.5"/>
      <path d="M35 33h20 M45 23v20" stroke="#49dfa7" stroke-width="2.5" stroke-linecap="round"/>
      <text x="20" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#e8f3ff">Opt-in startup</text>
      <text x="20" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#91afd0">You stay in control</text>
    </g>
  </g>

  <path d="M70 480h1058" stroke="#26445f" stroke-width="1.5"/>
  <text x="70" y="529" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#8daecc">WINDOWS 10 / 11</text>
  <text x="70" y="562" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6f8ba9">A small open-source helper for fast, focused workflows.</text>

  <g transform="translate(750 500)">
    <rect width="118" height="44" rx="22" fill="#102d4d" stroke="#275c8a"/>
    <text x="59" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#b8dcff">v1.0.0</text>
    <rect x="132" width="126" height="44" rx="22" fill="#102d4d" stroke="#275c8a"/>
    <text x="195" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#b8dcff">.NET 10</text>
    <rect x="272" width="146" height="44" rx="22" fill="#102d4d" stroke="#275c8a"/>
    <text x="345" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#b8dcff">MIT License</text>
  </g>
  <text x="1128" y="631" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#577997">INTERNETTOGGLE · SIMPLE. USEFUL. ALWAYS THERE.</text>
</svg>