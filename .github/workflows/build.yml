name: Build

on:
  push:
    branches:
      - master
      - "release/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore InternetToggle.slnx

      - name: Build
        run: dotnet build InternetToggle.slnx --configuration Release --no-restore
