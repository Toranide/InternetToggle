name: Build and Release

on:
  push:
    branches:
      - master
      - "release/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore InternetToggle.slnx

      - name: Build
        run: dotnet build InternetToggle.slnx --configuration Release --no-restore

      - name: Publish self-contained Windows executable
        run: dotnet publish InternetToggle/InternetToggle.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/win-x64

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: InternetToggle-win-x64
          path: artifacts/win-x64/InternetToggle.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download executable artifact
        uses: actions/download-artifact@v4
        with:
          name: InternetToggle-win-x64
          path: artifacts/win-x64

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "artifacts/win-x64/InternetToggle.exe" --title "$env:GITHUB_REF_NAME" --generate-notes
